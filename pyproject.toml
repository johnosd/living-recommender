[project]
name = "living-recommender"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "dbt-core>=1.9,<2",
  "dbt-duckdb>=1.9,<2",
  "geopandas>=1.0,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pyarrow>=20,<25",
  "pyogrio>=0.11,<1",
  "PyYAML>=6,<7",
  "shapely>=2,<3",
]

[dependency-groups]
dev = ["moto[s3]>=5,<6", "pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
