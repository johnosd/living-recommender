name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.12 and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check pipelines tests
      - name: Test without external services
        run: uv run --locked python -m pytest -q --basetemp .pytest_tmp
      - name: Prepare dbt fixture
        if: ${{ hashFiles('analytics/dbt/dbt_project.yml') != '' && hashFiles('tests/fixtures/caop/ci_seed.py') != '' }}
        run: uv run --locked python -m tests.fixtures.caop.ci_seed --root .data/ci
      - name: Build dbt from fixture
        if: ${{ hashFiles('analytics/dbt/dbt_project.yml') != '' && hashFiles('tests/fixtures/caop/ci_seed.py') != '' }}
        run: uv run --locked dbt build --project-dir analytics/dbt --profiles-dir analytics/dbt --target local --select tag:caop
      - name: Prepare observations fixture
        if: ${{ hashFiles('analytics/dbt/dbt_project.yml') != '' && hashFiles('tests/fixtures/observations/ci_seed.py') != '' }}
        run: uv run --locked python -m tests.fixtures.observations.ci_seed --root .data/ci-obs
      - name: Build dbt observations from fixture
        if: ${{ hashFiles('analytics/dbt/dbt_project.yml') != '' && hashFiles('tests/fixtures/observations/ci_seed.py') != '' }}
        run: uv run --locked dbt build --project-dir analytics/dbt --profiles-dir analytics/dbt --target local --select tag:observations

  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --exit-code 1 .
