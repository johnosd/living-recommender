version: 2

models:
  - name: stg_climate_daily
    description: Clima diário municipal; valores ausentes permanecem nulos e datas são dias locais.
    columns:
      - name: source_id
        data_tests: [not_null]
      - name: dico
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('caop_silver', 'dim_municipality')
                field: dico
      - name: variable
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]
      - name: unit
        data_tests: [not_null]
      - name: model
        data_tests: [not_null]
      - name: source_run_id
        data_tests: [not_null]
      - name: license_id
        data_tests: [not_null]
