    direction: maior_melhor
    levels: [municipio]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.1
    status: disponivel
    pending_reason: null
    methodology_pt: Média da temperatura mínima diária (Open-Meteo, ERA5) nos dias de dezembro, janeiro e fevereiro da janela.
    options: null
    compute: {kind: climate, metric: temp_min_inverno}

  - id: clima_precipitacao_anual
