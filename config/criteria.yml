# Catálogo de critérios do recomendador (spec 011, contracts/criteria-catalog.md).
# Fonte única de verdade: incluir ou mudar um critério é editar este arquivo; o build Gold
# (`python -m pipelines.cli.build_gold`) valida, calcula e gera uma `catalog_version` nova.
# Pesos, direções e faixas das opções são provisórios (R-003): revisão do autor antes da Fase 4.
schema_version: 1

categories:
  - {id: custo, label_pt: Custo, label_en: Cost}
  - {id: clima, label_pt: Clima, label_en: Climate}
  - {id: cultura, label_pt: Cultura, label_en: Culture}
  - {id: economia, label_pt: Economia, label_en: Economy}
  - {id: emprego, label_pt: Emprego e salários, label_en: Jobs and wages}
  - {id: educacao, label_pt: Educação, label_en: Education}
  - {id: populacao, label_pt: População, label_en: Population}
  - {id: comunidade, label_pt: Comunidade estrangeira, label_en: Foreign community}
  - {id: saude, label_pt: Saúde, label_en: Health}
  - {id: seguranca, label_pt: Segurança, label_en: Safety}
  - {id: distancia, label_pt: Distâncias, label_en: Distances}
  - {id: mercado, label_pt: Mercado imobiliário, label_en: Housing market}

criteria:
  # ---------------------------------------------------------------- custo
  - id: custo_aluguel_mediana
    category: custo
    label_pt: Aluguel mediano pedido
    label_en: Median asking rent
    unit: €/mês
    direction: menor_melhor
    levels: [municipio, freguesia]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.6
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Mediana (interpolação linear) do aluguel pedido nos anúncios do Idealista do snapshot vigente, por
      território e tipologia (todas, T0 a T4+). Outliers marcados por IQR de Tukey (1,5) dentro de cada
      território × tipologia ficam fora; só há mediana com pelo menos 10 anúncios. Cadeia por tipologia, quando
      não há amostra própria - o município herda do distrito (ou ilha) e, se faltar, da região do Idealista (não é
      a NUTS II); a freguesia herda o valor publicado do município. Valores herdados vêm marcados com o nível de
      origem e não entram na normalização. Anúncios sem município contam só no distrito e na região, nunca num
      município. Na freguesia, a amostra própria usa a marca de outlier do município.
    options: null
    compute: {kind: rent, metric: median, variants: [ALL, T0, T1, T2, T3, T4+]}
    compute_parish: {kind: rent, metric: median, variants: [ALL, T0, T1, T2, T3, T4+]}

  - id: custo_aluguel_m2
    category: custo
    label_pt: Aluguel mediano pedido por m²
    label_en: Median asking rent per m²
    unit: €/m²/mês
    direction: menor_melhor
    levels: [municipio, freguesia]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.2
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Mediana de aluguel ÷ área (m²) dos anúncios elegíveis do Idealista com área entre 10 e 1 000 m²; só
      com pelo menos 10 anúncios. Mesma regra de outliers e mesma cadeia de herança marcada da mediana de aluguel
      (município, distrito ou ilha, região do Idealista; freguesia herda o município).
    options: null
    compute: {kind: rent, metric: eur_m2_median, variants: [ALL]}
    compute_parish: {kind: rent, metric: eur_m2_median, variants: [ALL]}

  - id: custo_renda_ine_m2
    category: custo
    label_pt: Renda mediana dos novos contratos (INE)
    label_en: Median rent of new leases (INE)
    unit: €/m²
    direction: menor_melhor
    levels: [municipio]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.2
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Valor mediano das rendas por m² de novos contratos de arrendamento (INE, indicador 0014698), no ano
      mais recente publicado para o município. Valor oficial: o símbolo "-" não vira zero.
    options: null
    compute: {kind: observation, source_id: ine, dataset_id: rendas_novos_contratos, filters: [{}], dash_is_zero: false}

