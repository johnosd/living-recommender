      zero por convenção da fonte.
    options: null
    compute:
      kind: observation
      source_id: pordata
      dataset_id: desemprego_registado
      filters: [{filter_1: Total}]
      dash_is_zero: true
      per_population:
        scale: 100
        age_groups: ['15 - 19 anos', '20 - 24 anos', '25 - 29 anos', '30 - 34 anos', '35 - 39 anos',
