    label_pt: Temperatura média anual
    label_en: Mean annual temperature
    unit: °C
    direction: faixa_alvo
    levels: [municipio]
    modes: [peso, faixa, opcao]
    default_range: [null, null]
    weight: 0.3
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Média da temperatura média diária a 2 m (Open-Meteo, reanálise ERA5) na janela coletada (24 meses), no
      ponto representativo do município. Não é uma normal climatológica de 30 anos.
    options:
      - {id: fresco, label_pt: Fresco, label_en: Cool, range: [null, 14.5]}
      - {id: ameno, label_pt: Ameno, label_en: Mild, range: [14.5, 17]}
      - {id: quente, label_pt: Quente, label_en: Warm, range: [17, null]}
    compute: {kind: climate, metric: temp_media_anual}

  - id: clima_temp_max_verao
    category: clima
    label_pt: Máxima média no verão
    label_en: Mean summer maximum
    unit: °C
    direction: menor_melhor
    levels: [municipio]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.1
    status: disponivel
    pending_reason: null
    methodology_pt: Média da temperatura máxima diária (Open-Meteo, ERA5) nos dias de junho, julho e agosto da janela.
    options: null
    compute: {kind: climate, metric: temp_max_verao}

  - id: clima_temp_min_inverno
    category: clima
