    default_range: [null, null]
    weight: 0.1
    status: disponivel
    pending_reason: null
    methodology_pt: Média da duração diária de sol (Open-Meteo, ERA5, segundos ÷ 3 600) na janela.
    options: null
    compute: {kind: climate, metric: sol_horas_dia}

  - id: clima_dias_extremos_pct
    category: clima
    label_pt: Dias de clima extremo
    label_en: Extreme weather days
    unit: '% dos dias'
    direction: menor_melhor
    levels: [municipio]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.1
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Percentual de dias com calor (máxima > 35 °C ou aparente máxima > 40 °C), frio (mínima < 1 °C ou
      aparente mínima < −5 °C), chuva (> 35 mm) ou neve (> 0 cm). Regras do weatherClassifier legado, com a
      temperatura aparente do Open-Meteo no lugar do Heat Index e do Wind Chill do WWO; o UV do legado não
      entra (não existe no Open-Meteo).
    options: null
    compute: {kind: climate, metric: dias_extremos_pct}

  - id: clima_tci_anual
    category: clima
    label_pt: Índice de conforto climático (TCI)
    label_en: Tourism Climate Index (TCI)
    unit: índice 0–100
    direction: maior_melhor
    levels: [municipio]
    modes: [peso, faixa]
    default_range: [null, null]
    weight: 0.2
    status: disponivel
    pending_reason: null
    methodology_pt: >-
      Média dos TCI mensais (meses com pelo menos 20 dias válidos). TCI = 2·CID + 2·CIA + 0,5·P + 0,5·S + W,
      com as faixas do weatherClassifier legado: CID pela temperatura média, CIA pela máxima (−1 com umidade
      média < 30 % ou > 90 %), P pela precipitação do mês, S pelas horas de sol e W pelo vento médio. Variáveis
      do Open-Meteo (ERA5) no lugar das do WWO; máximo possível 60.
    options: null
    compute: {kind: climate, metric: tci_anual}

  - id: clima_temp_max_anual
    category: clima
    label_pt: Máxima média anual
    label_en: Mean annual maximum
    unit: °C
    direction: faixa_alvo
    levels: [municipio]
    modes: [faixa]
    default_range: [null, null]
    weight: 0
    status: disponivel
    pending_reason: null
    methodology_pt: Média da temperatura máxima diária a 2 m (Open-Meteo, ERA5) nos dias válidos da janela (24 meses).
    options: null
    compute: {kind: climate, metric: temp_max_anual}

