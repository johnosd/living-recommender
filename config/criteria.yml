    weight: 0.1
    status: disponivel
    pending_reason: null
    methodology_pt: Soma da precipitação diária (Open-Meteo, ERA5) na janela × 365,25 ÷ dias válidos.
    options: null
    compute: {kind: climate, metric: precipitacao_anual}

  - id: clima_sol_horas_dia
    category: clima
