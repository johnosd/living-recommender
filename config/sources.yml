sources:
  idealista:
    id: idealista
    publisher: Idealista
    responsible_party: living-recommender
    source_page: https://www.idealista.pt/
    license_id: not_granted_by_source
    usage_restriction: "Risco aceito no ADR-002 D4 e plano §3.4; somente agregados podem ser publicados. Brutos e anúncios individuais permanecem privados."
    attribution: "Fonte: Idealista, extração manual; período informado pelo operador"
    collection_method: manual_extension
    frequency: monthly_manual
    territorial_level: municipality_parish_or_region
    input_format: json

  caop:
    id: caop
    publisher: Direção-Geral do Território
    responsible_party: living-recommender
    source_page: https://www.dgterritorio.gov.pt/atividades/cartografia/cartografia-tematica/caop
    license_id: CC-BY-4.0
    attribution: "Fonte: Direção-Geral do Território (DGT), CAOP2025"
    collection_method: http_download
    frequency: annual_or_on_demand
    territorial_level: municipality_and_parish
    version: "2025"
    reference_period: "2025"
    urls:
      continente: https://geo2.dgterritorio.gov.pt/caop/CAOP_Continente_2025-gpkg.zip
      acores: https://geo2.dgterritorio.gov.pt/caop/CAOP_RAA_2025-gpkg.zip
      madeira: https://geo2.dgterritorio.gov.pt/caop/CAOP_RAM_2025-gpkg.zip

  pordata:
    id: pordata
    publisher: PORDATA (Fundação Francisco Manuel dos Santos)
    responsible_party: living-recommender
    # R-001 (plan 002): os Termos Legais do Pordata não concedem licença de reutilização;
    # o autor decidiu coletar mesmo assim, como risco aceito.
    license_id: not_granted_by_source
    attribution: "Fonte: PORDATA"
    collection_method: http_download
    frequency: monthly
    territorial_level: municipality
    name_column: "Nome Região (Portugal)"
    expected_labels: [Ano, "Nome Região (Portugal)", "Âmbito Geográfico", Escala, Símbolo, Valor]
    datasets:
      - {id: populacao_residente_sexo_idade, pordata_table: 1, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_4/1.csv"}
      - {id: densidade_populacional, pordata_table: 4, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_4/4.csv"}
      - {id: agencias_bancarias, pordata_table: 295, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/295.csv"}
      - {id: populacao_estrangeira_residente, pordata_table: 354, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/354.csv"}
      - {id: ensino_superior, pordata_table: 375, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/375.csv"}
      - {id: ensino_nao_superior, pordata_table: 379, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/379.csv"}
      - {id: desemprego_registado, pordata_table: 439, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/439.csv"}
      - {id: farmacias, pordata_table: 464, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/464.csv"}
      - {id: hospitais, pordata_table: 470, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/470.csv"}
      - {id: crimes_registados_policias, pordata_table: 559, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_14/559.csv"}
      - {id: crimes_por_categoria, pordata_table: 560, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/560.csv"}
      - {id: ganho_medio_mensal, pordata_table: 581, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/581.csv"}
      - {id: recintos_cinema, pordata_table: 623, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/623.csv"}
      - {id: sessoes_espetaculos_ao_vivo, pordata_table: 631, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/631.csv"}
      - {id: pessoal_ao_servico_empresas, pordata_table: 845, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/845.csv"}
      - {id: edificios_concluidos, pordata_table: 978, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/978.csv"}
      - {id: fogos_concluidos, pordata_table: 980, origin: "https://ffmspstdlspub01.blob.core.windows.net/data/Modelo_20/980.csv"}
      # Sem URL estável: o site só exporta por botão JavaScript. O operador entrega o Excel
      # (load_pordata_manual). Também existe o indicador equivalente na fonte `ine`.
      - {id: poder_compra_per_capita_xlsx, collection_method: manual_upload, format: xlsx, unit: "Número índice (Portugal = 100)"}

  ine:
    id: ine
    publisher: Instituto Nacional de Estatística, IP – Portugal
    responsible_party: living-recommender
    license_id: CC-BY-4.0
    attribution: "Instituto Nacional de Estatística, IP – Portugal"
    collection_method: api_json
    frequency: monthly
    territorial_level: municipality
    api_url: https://www.ine.pt/ine/json_indicador/pindica.jsp
    datasets:
      - id: rendas_novos_contratos
        indicator: "0014698"
        unit: "€/m²"
        params: {Dim1: T, Dim2: "lvl@5"}
      - id: taxa_criminalidade
        indicator: "0008074"
        unit: "‰"
        params: {Dim1: T, Dim2: "lvl@5", Dim3: "T,1,2,3,4,5,6"}
      - id: poder_compra_per_capita
        indicator: "0014580"
        unit: "Número índice (Portugal = 100)"
        params: {Dim1: T, Dim2: "lvl@5"}

  open_meteo:
    id: open_meteo
    publisher: Open-Meteo.com
    responsible_party: living-recommender
    # R-001 (plan 003): o plano gratuito é só para uso não comercial; o autor aceitou o risco (como no Pordata).
    license_id: CC-BY-4.0
    usage_restriction: "plano gratuito: uso não comercial (risco aceito R-001)"
    attribution: "Dados meteorológicos: Open-Meteo.com (CC BY 4.0); reanálise ERA5, Copernicus Climate Change Service/ECMWF"
    collection_method: api_json
    frequency: quarterly
    territorial_level: municipality
    api_url: https://archive-api.open-meteo.com/v1/archive
    model: era5                         # R1: o único modelo com as 13 variáveis completas e reprodutível
    timezone: auto                      # R2: o dia é o dia local do município
    window: {start: "2024-11-01", end: "2026-10-31"}   # 24 meses completos; 730 dias
    expected_municipalities: 308
    point_divergence_km: 25             # R6
    limits: {per_minute: 600, per_hour: 5000, per_day: 10000, min_interval_seconds: 7}
    variables:
      - {id: temperature_2m_mean, unit: "°C"}
      - {id: temperature_2m_max, unit: "°C"}
      - {id: temperature_2m_min, unit: "°C"}
      - {id: apparent_temperature_mean, unit: "°C"}
      - {id: apparent_temperature_max, unit: "°C"}
      - {id: apparent_temperature_min, unit: "°C"}
      - {id: precipitation_sum, unit: "mm"}
      - {id: snowfall_sum, unit: "cm"}
      - {id: sunshine_duration, unit: "s"}
      - {id: wind_speed_10m_mean, unit: "km/h"}
      - {id: wind_speed_10m_max, unit: "km/h"}
      - {id: wind_gusts_10m_max, unit: "km/h"}
      - {id: relative_humidity_2m_mean, unit: "%"}

  ine_parish_crosswalk:
    id: ine_parish_crosswalk
    publisher: Instituto Nacional de Estatística, IP – Portugal
    responsible_party: living-recommender
    # R-002 (plan 004, T028, 2026-11-12): o INE declara CC BY 4.0, com a fonte identificada, para a informação estatística
    # (aviso do catálogo de publicações 2026, lido por busca: a página devolveu 403 a download scriptado). O robots.txt do
    # smi.ine.pt não veta este coletor. Não há aviso específico para estas duas planilhas (metadados do SMI): CC-BY-4.0 é
    # a licença geral do INE aplicada a elas, ainda sem confirmação na página oficial.
    license_id: CC-BY-4.0
    attribution: "Instituto Nacional de Estatística, IP – Portugal"
    collection_method: http_download
    frequency: on_demand
    territorial_level: parish
    # Os links `Versao/Download/N` não têm estabilidade garantida (R-001): mudança vira falha explícita.
    datasets:
      - id: reorganizacao_2013
        role: pre2013_to_2013
        origin: https://smi.ine.pt/Versao/Download/9160
        format: xlsx
        sheet: "Correspondências 2013"
        columns:
          pre_code: "Código"
          pre_name: "Freguesias antes da Reorganização"
          name: "Freguesias - Reorganização de 2013"
          code: "Código Novo"
      - id: reposicao_2025
        role: pre2013_to_2025
        origin: https://smi.ine.pt/Versao/Download/10698
        format: xlsx
        sheet: "Sheet1"
        columns:
          pre_code: "Código - Freguesias antes da reorganização administrativa de 2013"
          pre_name: "Designação - Freguesias antes da reorganização administrativa de 2013"
          municipality_name: "Designação - Município"
          code: "Código - Freguesias repostas em 2025"
          name: "Designação - Freguesias repostas em 2025"

